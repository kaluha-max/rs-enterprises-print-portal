
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS ENTERPRISES Print Portal</title>
<style>
body{margin:0;background:#f1f5f9;font-family:Arial}
header{background:#102a43;color:white;padding:25px;text-align:center}
main{max-width:850px;margin:30px auto;padding:15px}
.card{background:white;padding:25px;margin:15px 0;border-radius:12px;box-shadow:0 3px 12px #ddd}
h2{color:#1769aa}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}
button{background:#1769aa;color:white;border:0;padding:12px 20px;border-radius:7px;cursor:pointer}
.balance{font-size:28px;color:green;font-weight:bold}
footer{text-align:center;padding:20px;color:#777}
</style>
</head>
<body>
<header>
<h1>RS ENTERPRISES</h1>
<p>FREE PRINT PORTAL</p>
</header>
<main>
<div class="card">
<h2>Welcome Customer</h2>
<p>RS ENTERPRISES Online Print Service Portal</p>
</div>
<div class="card">
<h2>Customer Login</h2>
<input type="tel" placeholder="Mobile Number" maxlength="10">
<button onclick="alert('Real OTP service abhi connect nahi hai')">Login / Get OTP</button>
</div>
<div class="card">
<h2>My Wallet Balance</h2>
<div class="balance">₹0.00</div>
<p>Wallet balance preview</p>
</div>
<div class="card">
<h2>Print Service Inquiry</h2>
<input placeholder="Customer Name">
<input placeholder="Mobile Number">
<select>
<option>Black & White Print</option>
<option>Colour Print</option>
<option>Photocopy</option>
<option>Scanning</option>
</select>
<textarea placeholder="Your message"></textarea>
<button onclick="alert('Demo only. Server connection pending.')">Submit Inquiry</button>
</div>
<div class="card">
<h2>Contact Us</h2>
<p>RS ENTERPRISES</p>
<p>Mobile: 8551962469</p>
</div>
</main>
<footer>© 2026 RS ENTERPRISES</footer>
</body>
</html>
